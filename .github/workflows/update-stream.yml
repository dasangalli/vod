name: Aggiorna Stream VOD su VM

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL di streaming (es. https://vixsrc.to/movie/7288/)'
        required: true
        default: 'https://vixsrc.to/movie/7288/'
      stream_id:
        description: 'ID dello stream'
        required: true
        default: '1'
      proxy:
        description: 'Proxy residenziale (es. http://ip:porta o socks5://ip:porta)'
        required: true
        default: 'http://83.56.15.57:5678'

jobs:
  deploy-and-sniff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Esegui Sniffer direttamente sulla VM via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
          STREAM_ID: ${{ github.event.inputs.stream_id }}
          PROXY: ${{ github.event.inputs.proxy }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=no ${VM_USER}@${VM_HOST} 'mkdir -p ~/vod/conf.d ~/vod/www'
          scp -o StrictHostKeyChecking=no sniffer-vod.py ${VM_USER}@${VM_HOST}:~/vod/
          
          ssh -o StrictHostKeyChecking=no ${VM_USER}@${VM_HOST} "
            cd ~/vod
            python3 -m pip install --user playwright > /dev/null 2>&1 || true
            export PATH=\$PATH:~/.local/bin
            python3 -m playwright install chromium --with-deps > /dev/null 2>&1 || true
            
            python3 sniffer-vod.py '$TARGET_URL' --stream-id '$STREAM_ID' --proxy '$PROXY' --conf-dir ./conf.d --out-dir ./www
            
            sudo docker compose -f ~/docker-compose-vod.yml restart nginx
          "
