name: Aggiorna Stream VOD Manuale

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL della pagina di streaming (es. https://vixsrc.to/movie/7288/)'
        required: true
        default: 'https://vixsrc.to/movie/7288/'
      stream_id:
        description: 'ID numerico o nome del canale (es. 1, 2, cinema)'
        required: true
        default: '1'

jobs:
  refresh-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run sniffer script
        run: |
          python sniffer-vod.py "${{ github.event.inputs.target_url }}" -i "${{ github.event.inputs.stream_id }}" --conf-dir . --out-dir .

      - name: Deploy to VM via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          scp -o StrictHostKeyChecking=no stream_${{ github.event.inputs.stream_id }}.conf ${VM_USER}@${VM_HOST}:~/vod/
          
          ssh -o StrictHostKeyChecking=no ${VM_USER}@${VM_HOST} 'sudo docker compose -f ~/docker-compose-vod.yml restart nginx'
