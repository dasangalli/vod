name: Aggiorna Stream VOD Manuale

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL della pagina di streaming (es. https://vixsrc.to/movie/7288/)'
        required: true
        default: 'https://vixsrc.to/movie/7288/'
      stream_id:
        description: 'ID numerico o nome del canale (es. 1, 2, cinema)'
        required: true
        default: '1'

jobs:
  refresh-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Esegui Sniffer direttamente sulla VM via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Copia lo script aggiornato sulla VM
          ssh -o StrictHostKeyChecking=no ${VM_USER}@${VM_HOST} 'mkdir -p ~/vod'
          scp -o StrictHostKeyChecking=no sniffer-vod.py ${VM_USER}@${VM_HOST}:~/vod/
          
          # Esegue Playwright e lo sniffer direttamente sulla VM (stesso IP)
          ssh -o StrictHostKeyChecking=no ${VM_USER}@${VM_HOST} '
            cd ~/vod
            python3 -m pip install --user playwright > /dev/null 2>&1 || true
            export PATH=$PATH:~/.local/bin
            python3 -m playwright install chromium --with-deps > /dev/null 2>&1 || true
            
            # Genera la configurazione usando l'IP e l'ambiente della VM
            python3 sniffer-vod.py "${{ github.event.inputs.target_url }}" -i "${{ github.event.inputs.stream_id }}" --conf-dir . --out-dir .
            
            # Riavvia Nginx per applicare la nuova configurazione
            sudo docker compose -f ~/docker-compose-vod.yml restart nginx
          '
